[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-kit"
version = "0.2.0"
description = "Resumable, provider-neutral agent workflow with independent verification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "engida32" }]
keywords = ["agents", "workflow", "llm", "verification", "resume"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/engida32/agent-workflow-kit"
Issues = "https://github.com/engida32/agent-workflow-kit/issues"

[project.scripts]
workflow = "workflow.cli:main"

[tool.setuptools]
package-dir = { "" = "runtime" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["runtime"]
include = ["workflow*"]

[tool.setuptools.data-files]
"share/agent-workflow/task-skills" = ["skill/task-skills/*.md"]
"share/agent-workflow" = ["runtime/config.example.json"]
