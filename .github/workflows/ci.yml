name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build; 22.04 does.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the offline test suite
        run: python -m unittest discover -s runtime/tests -v

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Smoke-test the installed command
        run: |
          workflow --version
          workflow --help

      - name: Smoke-test installed task skills
        run: |
          python - <<'PY'
          from pathlib import Path
          from workflow.cli import task_skills_dir

          skills = task_skills_dir()
          names = sorted(p.name for p in Path(skills).glob("*.md"))
          assert names == ["coding.md", "design.md", "evaluation.md", "research.md"], names
          print("task skills:", skills, names)
          PY
